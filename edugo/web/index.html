<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="edugo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>edugo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0175C2;
      color: #fff;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: sans-serif;
      padding: 24px;
    }
    /* Short viewport height in landscape is a reasonable proxy for "phone
       rotated sideways" without also matching wide desktop/tablet screens. */
    @media (orientation: landscape) and (max-height: 500px) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div style="font-size: 48px;">&#8635;</div>
    <p>Please rotate your device back to portrait to use this app.</p>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Best-effort lock for browsers/contexts that support it (mainly
    // Android Chrome in fullscreen/installed-PWA mode). Silently ignored
    // everywhere else -- the CSS overlay above is the real fallback.
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function () {});
    }
  </script>
</body>
</html>
